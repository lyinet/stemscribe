name: Build StemScribe macOS (Apple Silicon)

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (verify + tsc + cargo test + .dmg)
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust stable (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run static contract & config verification
        run: python3 scripts/verify_project.py

      - name: Install frontend dependencies & TypeScript build
        run: |
          npm ci
          npm run build

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test -- --nocapture

      - name: Build Apple Silicon .app & .dmg bundle
        run: npm run build:mac

      - name: Upload macOS DMG & App artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StemScribe-macOS-AppleSilicon-${{ github.run_number }}
          retention-days: 30
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      - name: Publish GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

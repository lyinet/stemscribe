name: Build StemScribe Windows (x64)

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Windows x64 (verify + tsc + cargo test + NSIS .exe)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run static contract & config verification
        run: python scripts/verify_project.py

      - name: Install frontend dependencies & TypeScript build
        run: |
          npm ci
          npm run build

      # ort-sys rc.10 falls back to fs::copy when symlinks aren't permitted and
      # panics if the destination dirs don't exist yet; pre-create them.
      - name: Pre-create ort-sys DLL output dirs
        run: |
          New-Item -ItemType Directory -Force `
            src-tauri/target/debug/deps, src-tauri/target/debug/examples, `
            src-tauri/target/debug/build/deps, src-tauri/target/debug/build/examples, `
            src-tauri/target/release/deps, src-tauri/target/release/examples, `
            src-tauri/target/release/build/deps, src-tauri/target/release/build/examples | Out-Null
        shell: pwsh

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test -- --nocapture

      - name: Build Windows NSIS installer
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml --release -p ort-sys
          npm run tauri build
          $DISPLAY_VERSION = node -p "require('./package.json').displayVersion"
          $NSIS_DIR = "src-tauri/target/release/bundle/nsis"
          Get-ChildItem "$NSIS_DIR/StemScribe_*_x64-setup.exe" | ForEach-Object {
            Move-Item $_.FullName "$NSIS_DIR/StemScribe_${DISPLAY_VERSION}_x64-setup.exe"
          }
        shell: pwsh

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: StemScribe-Windows-x64-${{ github.run_number }}
          retention-days: 30
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

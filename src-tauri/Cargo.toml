[package]
name = "stemscribe"
version = "0.15.1"
description = "StemScribe — macOS Apple Silicon AI Music Transcription, Cover Studio & Stage Workstation"
license = "MIT"
authors = ["StemScribe"]
edition = "2021"

[lib]
name = "stemscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
dirs = "6"
base64 = "0.22"

ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
ndarray = "0.16"

symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
midly = "0.5"
midir = "0.10"

reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"] }
rubato = "=5.1.0"
realfft = "=3.5.1"

# CoreML execution provider is macOS-only; Windows/Linux use the CPU provider.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.10", features = ["coreml", "ndarray"] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
